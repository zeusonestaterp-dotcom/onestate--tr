<html lang="tr">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
    min-height: 100vh;
    background:
        radial-gradient(circle at 10% 0%, #202b72 0%, transparent 32%),
        radial-gradient(circle at 90% 10%, #46186e 0%, transparent 30%),
        #070912;
}

.container {
    width: min(1250px, 94%);
    margin: auto;
    padding: 30px 0 60px;
}

.hero {
    text-align: center;
    padding: 45px 20px;
    margin-bottom: 25px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 28px;
    background: rgba(15,18,32,.82);
    backdrop-filter: blur(18px);
    box-shadow: 0 25px 80px rgba(0,0,0,.4);
}

.logo {
    width: 100px;
    height: 100px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 28px;
    background: linear-gradient(135deg,#6675ff,#8b4dff);
    font-size: 40px;
    font-weight: 900;
    box-shadow: 0 0 55px rgba(103,112,255,.35);
}

.hero h1 {
    margin-top: 22px;
    font-size: clamp(32px,6vw,60px);
    letter-spacing: 2px;
}

.hero h1 span {
    color: #7180ff;
}

.hero p {
    margin-top: 10px;
    color: #969daf;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    padding: 22px;
    border-radius: 20px;
    background: rgba(17,21,37,.85);
    border: 1px solid rgba(255,255,255,.07);
}

.stat small {
    color: #8d94a9;
}

.stat strong {
    display: block;
    margin-top: 8px;
    font-size: 28px;
}

.controls {
    padding: 20px;
    border-radius: 22px;
    background: rgba(14,17,30,.92);
    border: 1px solid rgba(255,255,255,.07);
    margin-bottom: 25px;
}

.search {
    width: 100%;
    padding: 17px 20px;
    border-radius: 14px;
    border: 1px solid #2b3047;
    background: #090c15;
    color: white;
    outline: none;
    font-size: 16px;
}

.search:focus {
    border-color: #6875ff;
    box-shadow: 0 0 0 3px rgba(104,117,255,.12);
}

.filters {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 15px;
}

.filter {
    border: 1px solid #292e43;
    background: #101421;
    color: #aeb3c4;
    padding: 11px 15px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 700;
}

.filter:hover,
.filter.active {
    background: #5967f5;
    border-color: #5967f5;
    color: white;
}

.section {
    margin-bottom: 25px;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 20px;
    border-radius: 20px 20px 0 0;
    background: linear-gradient(135deg,#181d34,#101421);
    border: 1px solid rgba(255,255,255,.07);
}

.section-title h2 {
    font-size: 21px;
}

.badge {
    background: #272d54;
    color: #aeb5ff;
    padding: 7px 12px;
    border-radius: 30px;
    font-size: 13px;
    white-space: nowrap;
}

.table-wrap {
    overflow-x: auto;
    background: #0d101a;
    border: 1px solid rgba(255,255,255,.07);
    border-top: 0;
    border-radius: 0 0 20px 20px;
}

table {
    width: 100%;
    min-width: 900px;
    border-collapse: collapse;
}

th {
    padding: 15px;
    text-align: left;
    background: #121625;
    color: #8d95ab;
    font-size: 12px;
    text-transform: uppercase;
}

td {
    padding: 15px;
    border-top: 1px solid rgba(255,255,255,.05);
    vertical-align: top;
}

tr:hover {
    background: rgba(95,105,255,.06);
}

.code {
    color: #8995ff;
    font-weight: 900;
    white-space: nowrap;
}

.punishment {
    font-weight: 700;
}

.turkish {
    color: #e5e7ed;
}

.duration {
    color: #82dfb1;
    font-weight: 800;
    white-space: nowrap;
}

.description {
    color: #949bad;
    font-size: 13px;
    line-height: 1.5;
}

.type-badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 800;
    margin-top: 5px;
}

.type-jail {
    background: rgba(255,190,50,.12);
    color: #ffc94d;
}

.type-mute {
    background: rgba(100,170,255,.12);
    color: #75baff;
}

.type-ban {
    background: rgba(255,70,90,.12);
    color: #ff7180;
}

.type-device {
    background: rgba(180,100,255,.12);
    color: #bd83ff;
}

.type-kick {
    background: rgba(150,150,150,.12);
    color: #c4c4c4;
}

.no-results {
    display: none;
    text-align: center;
    padding: 55px 20px;
    color: #8e95a8;
}

footer {
    text-align: center;
    color: #656c7e;
    font-size: 13px;
    padding-top: 20px;
}

@media(max-width:800px) {
    .stats {
        grid-template-columns: repeat(2,1fr);
    }

    .hero {
        padding: 35px 15px;
    }

    .logo {
        width: 80px;
        height: 80px;
        font-size: 32px;
    }
}

@media(max-width:500px) {
    .container {
        width: 95%;
    }

    .stats {
        gap: 10px;
    }

    .stat {
        padding: 16px;
    }

    .stat strong {
        font-size: 23px;
    }

    .hero h1 {
        font-size: 34px;
    }
}
</style>
</head>

["Clan6","GangRecruitmentGreenZone","Yeşil Alanda Çete Üye Alımı","Susturma 60 dk","Her yerde mesaj susturma","mute"],
["Clan10","GangCurrencyAbuse","Çete Paralarının Kötüye Kullanımı","30 Gün","Hesap","ban"]

];


/* =========================================================
   SİSTEM
========================================================= */

const admins = {
    1: admin1,
    2: admin2,
    3: admin3
};

let selectedAdmin = "all";
let selectedType = null;


    function normalizeCode(value) {
    return value
        .toLowerCase()
        .replace(/\s+/g, "")
        .trim();
}

function render() {
    const content = document.getElementById("content");
    const searchInput = document.getElementById("search").value.trim();
    const search = searchInput.toLowerCase();

    content.innerHTML = "";

    let totalVisible = 0;

    for (let level = 1; level <= 3; level++) {

        if (
            selectedAdmin !== "all" &&
            selectedAdmin !== String(level)
        ) {
            continue;
        }

        const rules = admins[level];

        const filtered = rules.filter(rule => {

            const code = normalizeCode(rule[0]);
            const name = rule[1].toLowerCase();
            const turkish = rule[2].toLowerCase();
            const punishment = rule[3].toLowerCase();
            const description = rule[4].toLowerCase();
            const type = rule[5];

            const matchesSearch =
                !search ||
                code.includes(search) ||
                name.includes(search) ||
                turkish.includes(search) ||
                punishment.includes(search) ||
                description.includes(search);

            const matchesType =
                !selectedType ||
                type === selectedType;

            return matchesSearch && matchesType;
        });

        if (filtered.length === 0) {
            continue;
        }

        totalVisible += filtered.length;

        const section = document.createElement("section");
        section.className = "section";

        section.innerHTML = `
            <div class="section-title">
                <h2>🛡️ Admin ${level} - ${
                    level === 1
                        ? "Helper"
                        : level === 2
                        ? "Moderator"
                        : "Administrator"
                }</h2>

                <span class="badge">
                    ${filtered.length} Kural
                </span>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Kod</th>
                            <th>Kural</th>
                            <th>Ceza</th>
                            <th>Açıklama</th>
                        </tr>
                    </thead>

                    <tbody>
                        ${filtered.map(rule => `
                            <tr>
                                <td class="code">${rule[0]}</td>
                                <td>
                                    <div class="punishment">
                                        ${rule[1]}
                                    </div>

                                    <div class="turkish">
                                        ${rule[2]}
                                    </div>
                                </td>

                                <td class="duration">
                                    ${rule[3]}
                                </td>

                                <td class="description">
                                    ${rule[4] || "-"}
                                </td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            </div>
        `;

        content.appendChild(section);
    }

    document.getElementById("totalRules").textContent = totalVisible;

    document.getElementById("noResults").style.display =
        totalVisible === 0 ? "block" : "none";
}


/* ARAMA */

document.getElementById("search").addEventListener("input", render);


/* FİLTRELER */

document.querySelectorAll(".filter").forEach(button => {

    button.addEventListener("click", () => {

        document
            .querySelectorAll(".filter")
            .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        if (button.dataset.admin) {
            selectedAdmin = button.dataset.admin;
            selectedType = null;
        }

        if (button.dataset.type) {
            selectedAdmin = "all";
            selectedType = button.dataset.type;
        }

        render();
    });

});


/* İLK YÜKLEME */

render();

</script>
