<html lang="tr">

<title>ONESTATE TR - Ceza Kuralları</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#070912;
    color:#f5f7ff;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:20px;
}

/* HEADER */
.hero{
    background:
        radial-gradient(circle at 50% 0%,rgba(99,91,255,.35),transparent 45%),
        linear-gradient(135deg,#11162c,#090b16);
    border:1px solid #262b45;
    border-radius:28px;
    padding:42px 20px;
    text-align:center;
    margin-bottom:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.logo{
    width:110px;
    height:110px;
    margin:0 auto 20px;
    border-radius:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:46px;
    font-weight:900;
    background:linear-gradient(135deg,#686cff,#8b4dff);
    box-shadow:0 15px 40px rgba(104,108,255,.35);
}

.hero h1{
    font-size:38px;
    letter-spacing:3px;
}

.hero h1 span{
    color:#667cff;
}

.hero p{
    color:#858ba5;
    margin-top:12px;
    font-size:16px;
}

/* STATS */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.stat{
    background:linear-gradient(145deg,#101423,#0c0f1b);
    border:1px solid #24293d;
    border-radius:20px;
    padding:20px;
}

.stat-title{
    color:#858ba5;
    font-size:14px;
    margin-bottom:8px;
}

.stat-value{
    font-size:30px;
    font-weight:800;
}

/* SEARCH */
.panel{
    background:linear-gradient(145deg,#101321,#0c0f1b);
    border:1px solid #24293d;
    border-radius:24px;
    padding:20px;
    margin-bottom:20px;
}

.search{
    width:100%;
    background:#080b14;
    border:1px solid #2a3047;
    color:#fff;
    padding:18px 20px;
    border-radius:17px;
    font-size:16px;
    outline:none;
}

.search:focus{
    border-color:#6871ff;
    box-shadow:0 0 0 3px rgba(104,113,255,.12);
}

.search::placeholder{
    color:#6e748c;
}

/* BUTTONS */
.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

.filter{
    border:1px solid #292f45;
    background:#101422;
    color:#bfc4d7;
    padding:12px 17px;
    border-radius:14px;
    cursor:pointer;
    font-size:14px;
    transition:.2s;
}

.filter:hover{
    border-color:#6871ff;
}

.filter.active{
    background:#5964f2;
    border-color:#5964f2;
    color:#fff;
}

.filter.jail.active{
    background:#b8860b;
}

.filter.mute.active{
    background:#c44747;
}

.filter.ban.active{
    background:#a52d55;
}

.filter.device.active{
    background:#7046bd;
}

/* INFO */
.info{
    color:#7f869e;
    font-size:13px;
    margin-top:15px;
}

/* RULES */
.rules{
    display:grid;
    gap:12px;
}

.rule{
    background:linear-gradient(145deg,#101422,#0b0e18);
    border:1px solid #252b40;
    border-radius:19px;
    padding:18px;
    transition:.2s;
}

.rule:hover{
    border-color:#555fd0;
    transform:translateY(-1px);
}

.rule-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
}

.code{
    display:inline-block;
    background:#202743;
    color:#91a0ff;
    border:1px solid #35406c;
    border-radius:9px;
    padding:6px 10px;
    font-weight:800;
    font-size:14px;
}

.level{
    font-size:12px;
    color:#858ba5;
    background:#171b2a;
    border-radius:20px;
    padding:6px 10px;
}

.rule-name{
    font-size:17px;
    font-weight:800;
    margin-bottom:5px;
}

.rule-tr{
    color:#a8aec1;
    font-size:14px;
    margin-bottom:13px;
}

.punishment{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
}

.badge{
    padding:7px 10px;
    border-radius:9px;
    font-size:13px;
    font-weight:800;
}

.badge.jail{
    background:#3d3013;
    color:#f1ca61;
}

.badge.mute{
    background:#3b1d24;
    color:#ff8f9d;
}

.badge.ban{
    background:#401b2c;
    color:#ff8caf;
}

.badge.device{
    background:#302047;
    color:#c49bff;
}

.badge.kick{
    background:#173748;
    color:#69c8f0;
}

.badge.perma{
    background:#401919;
    color:#ff7373;
}

.note{
    width:100%;
    color:#777f99;
    font-size:12px;
    margin-top:2px;
}

/* EMPTY */
.empty{
    display:none;
    text-align:center;
    padding:50px 20px;
    color:#777f99;
    background:#0d111d;
    border:1px solid #252b40;
    border-radius:20px;
}

.empty strong{
    display:block;
    color:#fff;
    font-size:20px;
    margin-bottom:8px;
}

/* FOOTER */
footer{
    text-align:center;
    color:#555d76;
    padding:35px 10px;
    font-size:13px;
}

/* MOBILE */
@media(max-width:700px){
    .container{
        padding:12px;
    }

    .hero{
        padding:30px 15px;
        border-radius:22px;
    }

    .hero h1{
        font-size:27px;
    }

    .logo{
        width:90px;
        height:90px;
        font-size:38px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .stat{
        padding:15px;
    }

    .stat-value{
        font-size:25px;
    }

    .rule{
        padding:15px;
    }

    .rule-name{
        font-size:16px;
    }

    .filter{
        padding:10px 13px;
        font-size:13px;
    }
}
</style>
</head>

function getAdminLabel(levels){

    if(levels.includes(3)){
        return "Admin 3";
    }

    if(levels.includes(2)){
        return "Admin 2";
    }

    return "Admin 1";
}

function getBadgeClass(type){

    if(type === "jail") return "jail";
    if(type === "mute") return "mute";

    if(type === "device") return "device";
    if(type === "perma") return "perma";

    return "kick";
}
